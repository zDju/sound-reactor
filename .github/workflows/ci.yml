name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's libraries (offscreen GUI tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # --no-sources: the detector comes from GitHub (the pinned archive in pyproject.toml), not
      # from ../sound-event-detector, which only exists on a developer's machine.
      - name: Install
        run: uv sync --no-sources
      - name: Lint
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Tests (fakes and synthetic audio; the GUI offscreen; never real keys)
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -rs -rfE --tb=short 2>&1 | tee pytest.log
      # Job logs need a GitHub login; annotations do not. Put the failures where anyone can read
      # them (the run page, or the check-runs annotations API).
      - name: Failures as an annotation
        if: failure()
        shell: bash
        run: |
          test -f pytest.log || exit 0
          summary=$(grep -E '^(FAILED|ERROR) |^E  |^[^ ]+\.py:[0-9]+: ' pytest.log | head -120)
          summary=${summary//'%'/'%25'}
          summary=${summary//$'\r'/}
          summary=${summary//$'\n'/'%0A'}
          echo "::error title=pytest failures (${{ matrix.os }})::${summary}"
